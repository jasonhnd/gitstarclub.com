name: CI

on:
  push:
    branches:
      - main
      - pre
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run audit:deps
      - run: bun install --frozen-lockfile
        working-directory: pipeline
      - run: bun run audit:deps
        working-directory: pipeline
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:tests
      - run: bun run typecheck:scripts
      - name: Run tests
        run: |
          set -o pipefail
          bun run test 2>&1 | tee test-output.txt
        env:
          # source.ts captures BLOB_BASE at module load; the readView unit tests need a
          # truthy base (fetch is mocked by path). Mirrors local .env.local.
          BLOB_BASE_URL: https://blob.example.com
          # Keep the deterministic gate network-free; release-seo runs the live suite on pushes.
          SEO_LIVE_BASE: ""
      - name: Write CI summary
        if: ${{ always() }}
        env:
          TESTED_SHA: ${{ github.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          passed=$(grep -oE '[0-9]+ pass' test-output.txt 2>/dev/null | tail -n 1 | cut -d ' ' -f 1 || true)
          skipped=$(grep -oE '[0-9]+ skip' test-output.txt 2>/dev/null | tail -n 1 | cut -d ' ' -f 1 || true)
          failed=$(grep -oE '[0-9]+ fail' test-output.txt 2>/dev/null | tail -n 1 | cut -d ' ' -f 1 || true)

          {
            echo "## CI verification"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Source event: \`$SOURCE_EVENT\`"
            echo "- Target branch: \`$TARGET_BRANCH\`"
            echo "- Bun version: \`$(bun --version)\`"
            echo "- Node version: \`$(node --version)\`"
            echo "- Tests: ${passed:-not run} passed, ${skipped:-not run} skipped, ${failed:-not run} failed"
          } >> "$GITHUB_STEP_SUMMARY"

  release-seo:
    name: Live SEO release verification
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify deployed SEO architecture
        env:
          SEO_LIVE_BASE: ${{ github.ref_name == 'main' && 'https://gitstarclub.com' || 'https://pre.gitstarclub.com' }}
          SEO_CANON_ORIGIN: https://gitstarclub.com
          SEO_EXPECT_INDEXABLE: ${{ github.ref_name == 'main' && '1' || '0' }}
        run: |
          for attempt in $(seq 1 12); do
            if bun test lib/integration/seo.test.ts; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            echo "Live SEO verification attempt $attempt failed; waiting for deployment propagation."
            sleep 15
          done
