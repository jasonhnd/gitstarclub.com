name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run docs:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
        env:
          # source.ts captures BLOB_BASE at module load; the readView unit tests need a
          # truthy base (fetch is mocked by path). Mirrors local .env.local.
          BLOB_BASE_URL: https://blob.example.com
