name: verify

on:
  push:
    branches:
      - main
      - pre
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  statuses: read

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Assert pinned runtime versions
        working-directory: .
        run: node scripts/assert-runtime-versions.mjs
      - name: Assert CF CI deploy gates (gitstarclub-web-pre; production triggers.crons [])
        working-directory: .
        run: node scripts/assert-cf-ci-gates.mjs
      - run: bun install --frozen-lockfile
      - run: bun run audit:deps
      - run: bun install --frozen-lockfile
        working-directory: pipeline
      - run: bun run audit:deps
        working-directory: pipeline
      - name: Run pipeline publication tests
        working-directory: pipeline
        run: bun run test
      - name: Validate documentation contracts
        working-directory: .
        run: bun run lint:docs
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:tests
      - run: bun run typecheck:scripts
      - name: Validate generated-view contract fixture
        run: bun run validate:views -- scripts/fixtures/views
      - name: Run tests
        run: |
          set -o pipefail
          bun run test:cov 2>&1 | tee test-output.txt
        env:
          # readView tests mock fetch but still require a syntactically valid read base.
          BLOB_BASE_URL: https://blob.example.com
          # Keep the deterministic gate network-free; live Preview checks are optional.
          SEO_LIVE_BASE: ""
      - name: Write static verification summary
        if: ${{ always() }}
        env:
          TESTED_SHA: ${{ github.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          passed=$(grep -oE '[0-9]+ pass' test-output.txt 2>/dev/null | tail -n 1 | cut -d ' ' -f 1 || true)
          skipped=$(grep -oE '[0-9]+ skip' test-output.txt 2>/dev/null | tail -n 1 | cut -d ' ' -f 1 || true)
          failed=$(grep -oE '[0-9]+ fail' test-output.txt 2>/dev/null | tail -n 1 | cut -d ' ' -f 1 || true)
          coverage=$(grep -E '^All files[[:space:]]+\|' test-output.txt 2>/dev/null | tail -n 1 || true)

          {
            echo "## Static verification"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Source event: \`$SOURCE_EVENT\`"
            echo "- Target branch: \`$TARGET_BRANCH\`"
            echo "- Bun version: \`$(bun --version)\`"
            echo "- Node version: \`$(node --version)\`"
            echo "- Tests: ${passed:-not run} passed, ${skipped:-not run} skipped, ${failed:-not run} failed"
            echo "- Coverage (functions | lines): \`${coverage:-not run}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  production-build:
    name: production-build
    needs: static
    runs-on: ubuntu-latest
    env:
      # The fixture server accepts only GET/HEAD and intentionally returns no live data.
      BLOB_BASE_URL: http://127.0.0.1:4010
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Assert pinned runtime versions
        working-directory: .
        run: node scripts/assert-runtime-versions.mjs
      - run: bun install --frozen-lockfile
      - name: Validate read-only build configuration
        run: |
          if [ -n "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            echo "::error::Read-only production build must not receive BLOB_READ_WRITE_TOKEN"
            exit 1
          fi
          missing=()
          for key in BLOB_BASE_URL; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required read-only build variables: ${missing[*]}"
            exit 1
          fi
          echo "Build data source: $BLOB_BASE_URL (local read-only fixture)"
      - name: Build production application
        run: |
          bun scripts/ci-build-fixture-server.ts > "$RUNNER_TEMP/build-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$BLOB_BASE_URL/_health" > /dev/null; then
              bun run build
              exit $?
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/build-fixture.log"
          echo "::error::Read-only build fixture did not become ready"
          exit 1
      - name: Write production build summary
        if: ${{ always() }}
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Production build"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Node version: \`$(node --version)\`"
            echo "- Bun version: \`$(bun --version)\`"
            echo "- Data source: local read-only fixture"
            echo "- Write-capable credentials: none"
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional / skippable: Chromium against an exact-SHA Vercel Preview when one exists.
  # Ignored Build / no Preview URL → resolve exits 0 with skipped=true (job stays green).
  # Not a GitHub required check. Required merge gates are static + production-build.
  # Do not add cf-preview / cf-workers-host to required checks.
  preview-e2e:
    name: preview-e2e
    needs: production-build
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.deployment.outputs.skipped }}
    # Allow long Vercel preview builds (often 9–14 min) plus Playwright suites.
    timeout-minutes: 40
    env:
      IDENTITY_ORIGIN: ${{ github.event_name == 'push' && (github.ref_name == 'main' && 'https://gitstarclub.com' || 'https://pre.gitstarclub.com') || '' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Assert pinned runtime versions
        working-directory: .
        run: node scripts/assert-runtime-versions.mjs
      - run: bun install --frozen-lockfile
      - name: Resolve exact Vercel deployment
        id: deployment
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/resolve-vercel-preview.ts
      - name: Install Chromium
        if: steps.deployment.outputs.skipped != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Verify deterministic generated assets
        if: steps.deployment.outputs.skipped != 'true'
        working-directory: .
        run: bun run assets:check
      - name: Run accessibility and responsive release suites
        if: steps.deployment.outputs.skipped != 'true'
        env:
          BASE_URL: ${{ steps.deployment.outputs.url }}
        run: bunx playwright test e2e/accessibility-responsive.spec.ts e2e/horizontal-overflow.spec.ts e2e/search-compare-interactions.spec.ts
      - name: Verify deployed SEO architecture
        if: ${{ github.event_name == 'push' && steps.deployment.outputs.skipped != 'true' }}
        env:
          SEO_LIVE_BASE: ${{ steps.deployment.outputs.url }}
          SEO_CANON_ORIGIN: https://gitstarclub.com
          SEO_EXPECT_INDEXABLE: ${{ github.ref_name == 'main' && '1' || '0' }}
        run: bun test lib/integration/seo.test.ts
      - name: Write preview release summary
        if: ${{ always() }}
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SKIPPED: ${{ steps.deployment.outputs.skipped }}
          SKIP_REASON: ${{ steps.deployment.outputs.skip_reason }}
        run: |
          {
            echo "## Preview browser release gate"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Node version: \`$(node --version)\`"
            echo "- Bun version: \`$(bun --version)\`"
            echo "- Required GitHub gates: verify / static, verify / production-build"
            echo "- This job is not a required merge gate"
            echo "- Skipped: ${SKIPPED:-false}"
            if [ "${SKIPPED}" = "true" ]; then
              echo "- Skip reason: ${SKIP_REASON:-no Vercel Preview}"
            else
              echo "- Deployment URL: ${DEPLOYMENT_URL:-not resolved}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-release-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            web/playwright-report/
            web/test-results/
            web/release-metadata.json

  # Optional / skippable product-level live gates (#286). Fail closed when a Vercel Preview exists.
  # Same skip as preview-e2e: Ignored Build / no Preview → job skipped (not red).
  # Not a GitHub required check. Required merge gates are static + production-build.
  product-gates:
    name: product-gates
    needs: preview-e2e
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && needs.preview-e2e.result == 'success' && needs.preview-e2e.outputs.skipped != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IDENTITY_ORIGIN: ${{ github.event_name == 'push' && (github.ref_name == 'main' && 'https://gitstarclub.com' || 'https://pre.gitstarclub.com') || '' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Resolve exact Vercel deployment
        id: deployment
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/resolve-vercel-preview.ts
      - name: Run live product release gates
        if: steps.deployment.outputs.skipped != 'true'
        env:
          RELEASE_GATE_REQUIRE_LIVE: "1"
          RELEASE_GATE_SITE: ${{ steps.deployment.outputs.url }}
          # Public Blob store base (public-read). Override via repo variable when set.
          RELEASE_GATE_BLOB_BASE: ${{ vars.BLOB_BASE_URL }}
        run: |
          if [ -z "${RELEASE_GATE_BLOB_BASE}" ]; then
            # Default public production Blob base — not a secret (store is public).
            export RELEASE_GATE_BLOB_BASE="https://cdv7ejjwmzbbdj8w.public.blob.vercel-storage.com"
          fi
          echo "product-gates site=${RELEASE_GATE_SITE}"
          echo "product-gates blob_host=$(node -e "console.log(new URL(process.env.RELEASE_GATE_BLOB_BASE).host)")"
          bun test lib/integration/release-gates.test.ts lib/integration/release-gates-live.test.ts
      - name: Write product gates summary
        if: ${{ always() }}
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SKIPPED: ${{ steps.deployment.outputs.skipped }}
          SKIP_REASON: ${{ steps.deployment.outputs.skip_reason }}
        run: |
          {
            echo "## Product release gates (#286)"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Required GitHub gates: verify / static, verify / production-build"
            echo "- This job is not a required merge gate"
            echo "- Skipped: ${SKIPPED:-false}"
            if [ "${SKIPPED}" = "true" ]; then
              echo "- Skip reason: ${SKIP_REASON:-no Vercel Preview}"
            else
              echo "- Deployment URL: ${DEPLOYMENT_URL:-not resolved}"
              echo "- Live checks: required when a Vercel Preview exists (search-index, sync-runs, base pointer, exports, generation-aware period continuity)"
              echo "- Live history: bounded validated manifest chain, then legacy migration edge"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional CF Preview dual-run (P2). NOT a production required check.
  # Do not add this job name to .delivery.yml or GitHub required status checks.
  # Enable with repo variable CF_PREVIEW_ENABLED=1 and Access Service Token secrets.
  # Allowlist: `pre` branch or PRs targeting `pre` only. Probe the preview Worker
  # gitstarclub-web-pre — never the closed production workers.dev host.
  cf-preview:
    name: cf-preview
    if: ${{ vars.CF_PREVIEW_ENABLED == '1' && (github.ref_name == 'pre' || github.base_ref == 'pre') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_TARGET: cf
      CF_PREVIEW_ORIGIN: ${{ vars.CF_PREVIEW_ORIGIN || 'https://gitstarclub-web-pre.worldgo.workers.dev' }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Assert pinned runtime versions
        working-directory: .
        run: node scripts/assert-runtime-versions.mjs
      - run: bun install --frozen-lockfile
      - name: Assert CF preview origin is allowlisted
        working-directory: .
        run: node scripts/assert-cf-ci-gates.mjs --preview-origin
      - name: Resolve CF Preview identity
        id: deployment
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/resolve-preview.ts
      - name: Probe CF Preview hot-path invalidate stub
        run: bun scripts/cf-preview-hot-path.ts
      - name: Write CF Preview dual-run summary
        if: ${{ always() }}
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## CF Preview dual-run (optional; not a production required check)"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- CF Preview origin: ${DEPLOYMENT_URL:-not resolved}"
            echo "- Default probe: https://gitstarclub-web-pre.worldgo.workers.dev (Worker gitstarclub-web-pre)"
            echo "- Access: Service Token headers CF-Access-Client-Id / CF-Access-Client-Secret"
            echo "- Required GitHub gates remain verify / static, production-build"
            echo "- preview-e2e / product-gates soft-skip without a Vercel Preview; they are not required"
            echo "- Do not add this job to required checks"
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional CF Workers host preview build (P3 / OpenNext). NOT a production required check.
  # Do not add this job name to .delivery.yml or GitHub required status checks.
  # Enable with repo variable CF_WORKERS_HOST_ENABLED=1. Does not require Access.
  # Allowlist: `pre` branch or PRs targeting `pre` only. bun run cf:dry-run is
  # wrangler deploy --dry-run --env pre (Worker gitstarclub-web-pre). Removing
  # --dry-run must not target production Worker gitstarclub-web; the wrapper
  # refuses a live deploy of that name. GHA must never wrangler deploy without
  # --dry-run.
  cf-workers-host:
    name: cf-workers-host
    if: ${{ vars.CF_WORKERS_HOST_ENABLED == '1' && (github.ref_name == 'pre' || github.base_ref == 'pre') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOB_BASE_URL: http://127.0.0.1:4010
      HOSTING_TARGET: cf
      NODE_OPTIONS: --max-old-space-size=8192
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Assert pinned runtime versions
        working-directory: .
        run: node scripts/assert-runtime-versions.mjs
      - run: bun install --frozen-lockfile
      - name: Build OpenNext Worker preview (fixture, no Access)
        run: |
          bun scripts/ci-build-fixture-server.ts > "$RUNNER_TEMP/cf-host-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$BLOB_BASE_URL/_health" > /dev/null; then
              bun run cf:dry-run
              exit $?
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cf-host-fixture.log"
          echo "::error::Read-only OpenNext fixture did not become ready"
          exit 1
      - name: Write CF Workers host summary
        if: ${{ always() }}
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## CF Workers host preview (optional; not a production required check)"
            echo
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Adapter: OpenNext (\`@opennextjs/cloudflare\`) wrapping \`workers/gitstarclub-web\`"
            echo "- Wrangler env: \`pre\` (Worker \`gitstarclub-web-pre\`)"
            echo "- Access: not required for this build"
            echo "- Deploy: dry-run only via \`scripts/cf-wrangler-dry-run.mjs\` (never live-deploys \`gitstarclub-web\`)"
            echo "- Required GitHub gates remain verify / static, production-build"
            echo "- preview-e2e / product-gates soft-skip without a Vercel Preview; they are not required"
            echo "- Do not add this job to required checks"
          } >> "$GITHUB_STEP_SUMMARY"
