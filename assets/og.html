<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ===== Material 3 Expressive — graphite surfaces + star-gold accent ===== */
  :root {
    --md-sys-color-primary-container: #f2a900;
    --md-sys-color-on-primary-container: #614200;
    --md-sys-color-primary-fixed-dim: #ffba3b;
    --md-sys-color-tertiary: #9edaff;
    --md-sys-color-tertiary-container: #3fc3ff;
    --md-sys-color-on-tertiary-container: #004e6b;
    --md-sys-color-background: #121316;
    --md-sys-color-on-surface: #e3e2e6;
    --md-sys-color-on-surface-variant: #c3c7cf;
    --md-sys-color-surface-container-high: #282a2d;
    --md-sys-color-outline-variant: #43474e;

    --shape-m: 12px;
    --shape-full: 999px;
    --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--md-sys-color-background);
    color: var(--md-sys-color-on-surface);
    font-family: var(--font-sans);
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ===== Top bar ===== */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
  }
  .mark {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: -0.02em;
    color: var(--md-sys-color-on-surface);
  }
  .mark .star { color: var(--md-sys-color-primary-fixed-dim); font-size: 1.05em; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 22px;
    border-radius: var(--shape-full);
    background: color-mix(in oklab, var(--md-sys-color-tertiary-container) 55%, transparent);
    color: var(--md-sys-color-on-tertiary-container);
    font-size: 19px;
    font-weight: 600;
    border: 1px solid color-mix(in oklab, var(--md-sys-color-tertiary) 35%, transparent);
  }
  .chip .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--md-sys-color-tertiary); }

  /* ===== Main ===== */
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    font-weight: 800;
    font-size: 78px;
    line-height: 1.04;
    letter-spacing: -0.035em;
  }
  .hl {
    color: var(--md-sys-color-on-primary-container);
    background: var(--md-sys-color-primary-container);
    border-radius: var(--shape-m);
    padding: 0.01em 0.16em;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .lede {
    margin-top: 22px;
    font-size: 27px;
    font-weight: 400;
    line-height: 1.3;
    color: var(--md-sys-color-on-surface-variant);
    max-width: 38ch;
  }

  /* ===== Year spine ===== */
  .spine { display: flex; gap: 16px; align-items: flex-end; margin-top: 30px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .col .bar {
    width: 34px;
    border-radius: var(--shape-full);
    background: var(--md-sys-color-primary-container);
  }
  .col.peak .bar { background: var(--md-sys-color-primary-fixed-dim); }
  .col .yr {
    font-family: var(--font-mono);
    font-size: 17px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface-variant);
    font-variant-numeric: tabular-nums;
  }

  /* ===== Footer ===== */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 24px;
    border-top: 1px solid var(--md-sys-color-outline-variant);
    font-size: 21px;
    color: var(--md-sys-color-on-surface-variant);
  }
  footer .url { font-family: var(--font-mono); font-weight: 500; color: var(--md-sys-color-on-surface); }
</style>
</head>
<body>
  <div class="top">
    <span class="mark"><span class="star">&#9733;</span>gitstarclub</span>
    <span class="chip"><span class="dot"></span>Launching soon</span>
  </div>

  <main>
    <h1>A chronicle of<br><span class="hl">open source</span>.</h1>
    <p class="lede">Look back, month by month, at which GitHub projects were rising.</p>

    <div class="spine">
      <div class="col"><div class="bar" style="height:22px"></div><span class="yr">2019</span></div>
      <div class="col"><div class="bar" style="height:32px"></div><span class="yr">2020</span></div>
      <div class="col"><div class="bar" style="height:40px"></div><span class="yr">2021</span></div>
      <div class="col"><div class="bar" style="height:36px"></div><span class="yr">2022</span></div>
      <div class="col"><div class="bar" style="height:54px"></div><span class="yr">2023</span></div>
      <div class="col peak"><div class="bar" style="height:66px"></div><span class="yr">2024</span></div>
      <div class="col"><div class="bar" style="height:58px"></div><span class="yr">2025</span></div>
    </div>
  </main>

  <footer>
    <span>Indexing more than a decade of GitHub &middot; 5,300+ projects above 10k stars</span>
    <span class="url">gitstarclub.com</span>
  </footer>
</body>
</html>
