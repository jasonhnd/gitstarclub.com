    <text x="84" y="286" fill="#614200" font-size="78" font-weight="800" letter-spacing="-2.73">open source</text>
    <text x="551" y="286" fill="#e3e2e6" font-size="78" font-weight="800">.</text>

    <text x="72" y="348" fill="#c3c7cf" font-size="27" font-weight="400">Explore the current open-source pulse and the history</text>
    <text x="72" y="383" fill="#c3c7cf" font-size="27" font-weight="400">of when projects rose.</text>

    <g fill="#f2a900">
      <rect x="75" y="465" width="34" height="22" rx="11"/>
      <rect x="132" y="455" width="34" height="32" rx="17"/>
      <rect x="189" y="447" width="34" height="40" rx="17"/>
      <rect x="246" y="451" width="34" height="36" rx="17"/>
      <rect x="303" y="433" width="34" height="54" rx="17"/>
