    <text x="72" y="566" fill="#c3c7cf" font-size="21">Indexing more than a decade of GitHub · 5,300+ projects above 10k stars</text>
    <text x="939" y="566" fill="#e3e2e6" font-family="Geist Mono, monospace" font-size="21" font-weight="500">gitstarclub.com</text>
