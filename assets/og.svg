<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">GitStarClub.com</title>
  <desc id="description">A chronicle of open source star history.</desc>
  <rect width="1200" height="630" fill="#121316"/>

  <g font-family="Geist, sans-serif">
    <path d="M88 74l3.6 10.2 10.8.3-8.6 6.5 3.1 10.4-8.9-6-8.9 6 3.1-10.4-8.6-6.5 10.8-.3z" fill="#ffba3b"/>
    <text x="115" y="100" fill="#e3e2e6" font-size="30" font-weight="800">GitStarClub.com</text>

    <rect x="954" y="65" width="174" height="47" rx="23.5" fill="#3b91b5" stroke="#63c6ee" stroke-opacity=".65"/>
    <circle cx="982.5" cy="88.5" r="5.5" fill="#9edaff"/>
    <text x="998" y="96" fill="#004e6b" font-size="19" font-weight="600">Star history</text>

    <path d="M72 136.5h1056" stroke="#43474e"/>

